name: security-auditor-ci

on:
  push:
    paths:
      - 'projects/security-auditor/**'
      - '.github/workflows/security-auditor-ci.yml'
  pull_request:
    paths:
      - 'projects/security-auditor/**'
      - '.github/workflows/security-auditor-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/security-auditor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Lint
        run: make lint

      - name: Test
        run: pytest --cov=src --cov-report=xml

      - name: Build check
        run: python setup.py --name
