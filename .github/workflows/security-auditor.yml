name: Security Auditor

on:
  push:
    paths:
      - 'projects/security-auditor/**'
      - 'tests/test_integration.py'
      - '.github/workflows/security-auditor.yml'
  pull_request:
    paths:
      - 'projects/security-auditor/**'
      - 'tests/test_integration.py'
      - '.github/workflows/security-auditor.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -e ./projects/security-auditor[dev]

      - name: Lint
        run: python -m ruff check projects/security-auditor/src projects/security-auditor/tests projects/security-auditor/examples tests/test_integration.py

      - name: Run tests with coverage
        run: |
          cd projects/security-auditor
          python -m pytest tests ../../tests/test_integration.py --cov=src --cov-report=term --cov-report=xml

      - name: Build package
        run: python -m build projects/security-auditor
