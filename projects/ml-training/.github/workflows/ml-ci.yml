name: ML Training CI

on:
  push:
    paths:
      - "projects/ml-training/**"
  pull_request:
    paths:
      - "projects/ml-training/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ml-training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests -q
